<title>Lab 7 AutoCAD Steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one reading column; sticky tab bar; each step is a card with an input → result grid */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#152036; --muted:#5b6780; --line:#d8dee9;
  --accent:#1f4fd6; --accent-ink:#ffffff; --cmd:#e9eefb; --cmd-ink:#10245e;
  --ok-bg:#e6f4ec; --ok-ink:#16603a; --warn-bg:#fdf1de; --warn-ink:#7a4700;
  --key-bg:#ffffff; --done:#eef5f0;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1522; --surface:#172033; --ink:#e6ebf5; --muted:#9aa7c0; --line:#2a3650;
  --accent:#6f95ff; --accent-ink:#0b1224; --cmd:#1f2d4f; --cmd-ink:#dbe5ff;
  --ok-bg:#15332a; --ok-ink:#8fe0b4; --warn-bg:#3a2a10; --warn-ink:#f5c983;
  --key-bg:#23304a; --done:#172a26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1522; --surface:#172033; --ink:#e6ebf5; --muted:#9aa7c0; --line:#2a3650;
  --accent:#6f95ff; --accent-ink:#0b1224; --cmd:#1f2d4f; --cmd-ink:#dbe5ff;
  --ok-bg:#15332a; --ok-ink:#8fe0b4; --warn-bg:#3a2a10; --warn-ink:#f5c983;
  --key-bg:#23304a; --done:#172a26; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
header h1{font:700 clamp(26px,5vw,36px)/1.1 var(--f-display);margin:4px 0 6px;text-wrap:balance}
.eyebrow{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);margin:0 0 14px;max-width:62ch}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.legend span{display:inline-flex;gap:8px;align-items:center}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-top:14px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{font:600 14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;white-space:nowrap;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs button:focus-visible,.copy:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tab small{font-weight:500;opacity:.8;margin-left:6px;font-variant-numeric:tabular-nums}
section.panel{display:grid;gap:14px;margin-top:16px}
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.intro h2{font:700 24px/1.2 var(--f-display);margin:0 0 8px}
.intro dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.intro dt{color:var(--muted)} .intro dd{margin:0;font-weight:500}
.pics{display:grid;gap:8px;align-content:start}
.pics figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
.pics img{display:block;width:100%;height:auto}
.pics figcaption{font-size:12px;color:#4a5670;margin-top:4px;text-align:center}
.fix{margin-top:12px;background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 12px;font-size:14px}
.fix b{color:inherit}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step.is-done{background:var(--done)}
.step-head{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.num{font:700 13px var(--f-mono);color:var(--accent);min-width:3.2em}
.step-head h3{font:700 19px/1.25 var(--f-display);margin:0;flex:1;min-width:0}
.done{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.done input{width:18px;height:18px;accent-color:var(--accent)}
.goal{margin:0;padding:10px 16px 0;color:var(--muted);font-size:14px}
.rows{display:grid;padding:8px 16px 12px}
.colhead,.row{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:4px 16px;align-items:center}
.colhead{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.row{padding:8px 0;border-top:1px dashed var(--line)}
.row:first-of-type{border-top:0}
.what{font-size:14px;min-width:0}
.what i{color:var(--muted)}
.in{display:flex;gap:6px;align-items:center;min-width:0;flex-wrap:wrap}
.cmd{font:600 16px var(--f-mono);background:var(--cmd);color:var(--cmd-ink);border-radius:6px;padding:3px 9px;white-space:nowrap}
.copy{font:500 12px var(--f-body);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:6px;padding:2px 7px;cursor:pointer}
.copy.ok{color:var(--ok-ink);border-color:var(--ok-ink)}
kbd,.key{font:600 13px var(--f-mono);background:var(--key-bg);color:var(--ink);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:2px 8px;white-space:nowrap}
.act{font-size:14px;font-weight:500}
.act .tag{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:block}
.callout{margin:0 16px 14px;border-radius:8px;padding:10px 12px;font-size:14px}
.callout.check{background:var(--ok-bg);color:var(--ok-ink)}
.callout.warn{background:var(--warn-bg);color:var(--warn-ink)}
.callout .lbl{font-weight:700;margin-right:6px}
code{font:600 13.5px var(--f-mono);background:var(--cmd);color:var(--cmd-ink);border-radius:4px;padding:1px 5px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
h2.sub{font:700 20px var(--f-display);margin:10px 0 0}
@media (max-width:620px){
  .intro{grid-template-columns:1fr}
  .colhead{display:none}
  .row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style><style>
.stepfig{margin:0 16px 14px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
.stepfig img{display:block;max-width:100%;height:auto;margin:0 auto}
.stepfig figcaption{font-size:12px;color:#4a5670;text-align:center;margin-top:4px}
.intro.one{grid-template-columns:1fr}
.files{margin:8px 0 0;padding-left:18px;font-size:14px}
.files li{margin:2px 0}
</style>

{id:"a",label:"A · Title block",intro:{h:"Part A – title block template",dl:[["Handout","Steps 1–25"],["Units","Inches (paper space)"],["Turn in","dwg + dwt + PDF"]],pics:[["tb","What you add inside the big top box"]]},steps:[
 {t:"Start from the Civil Imperial template",r:[
  ["T","NEW","The <b>Select Template</b> window opens."],
  ["Do","Double-click the <b>SheetSets</b> folder","A list of templates appears."],
  ["Do","Click <b>Civil Imperial</b>, then click <b>Open</b>","A layout tab named <b>D-Size</b> opens with a title block."]]},
 {t:"Rename the layout tab",r:[
  ["Do","Double-click the <b>D-Size</b> tab at the bottom of the screen","The name becomes editable."],
  ["Do","Type <b>ANSI Size-D</b> and press <kbd>Enter</kbd>","The tab is renamed."]]},
 {t:"Page setup: PDF printer, ANSI D paper",r:[
  ["T","PAGESETUP","The <b>Page Setup Manager</b> opens."],
  ["Do","Click <b>*ANSI Size-D*</b> in the list, then click <b>Modify…</b>","The <b>Page Setup</b> window opens."],
  ["Do","<b>Printer/plotter → Name:</b> AutoCAD PDF (General Documentation).pc3",""],
  ["Do","<b>Paper size:</b> ANSI D (22.00 x 34.00 Inches)",""],
  ["Do","Check: What to plot <b>Layout</b>, Scale <b>1:1</b>, <b>Landscape</b>. Click <b>OK</b>, then <b>Close</b>","The title block now hangs past the dashed paper edge. That's expected."]]},
 {t:"Shrink the title block to fit (×0.91)",r:[
  ["T","SCALE","Asks: <i>Select objects</i>"],
  ["Do","Click the title block's <b>outer edge</b>","The whole title block highlights."],
  ["K","Enter","Asks: <i>Specify base point</i>"],
  ["Do","Click the title block's <b>lower-left corner</b> (wait for the square snap marker)","Asks: <i>Specify scale factor</i>"],
  ["T","0.91","The title block shrinks from 24×36 to 22×34 size."]]},
 {t:"Move it onto the paper",r:[
  ["T","MOVE","Asks: <i>Select objects</i>"],
  ["Do","Click the title block's outer edge","It highlights."],
  ["K","Enter","Asks: <i>Specify base point</i>"],
  ["Do","Click its <b>lower-left corner</b>","Asks for the second point"],
  ["T",".5,.25","The title block sits inside the dashed paper lines."]]},
 {t:"Fill in the gray fields (attributes)",r:[
  ["Do","Double-click any <b>gray field</b> in the title block","The <b>Enhanced Attribute Editor</b> opens."],
  ["Do","Click each <b>Tag</b> in the list and type its <b>Value</b> at the bottom","Project name: CE 20 LAB 7. Address lines: SAN JOSE STATE UNIVERSITY / ONE WASHINGTON SQUARE / SAN JOSE, CA 95192. Project: LAB 7. Date: today. Scale: AS NOTED. Sheet: 1."],
  ["Do","Click <b>Apply</b>, then <b>OK</b>","The gray fields show your values."]],
  check:"Compare with the bottom boxes of the reference sheet (Start tab)."},
 {t:"Set the thick lineweight (0.028\")",r:[
  ["T","LWEIGHT","The <b>Lineweight Settings</b> window opens."],
  ["Do","<b>Units for Listing:</b> Inches. Click <b>0.028\"</b> in the list. Check <b>Display Lineweight</b>. Click <b>OK</b>","New lines will be thick."]]},
 {t:"Draw the first divider line (3.25\" below General Notes)",g:"Zoom in on the big empty box at the top of the title-block column. FRO means \"measure from a point\".",r:[
  ["T","LINE","Asks for the first point"],
  ["T","FRO","Asks: <i>Base point</i>"],
  ["Do","Click the <b>LEFT end</b> of the line under the words <b>General Notes</b>","Asks: <i>&lt;Offset&gt;</i>"],
  ["T","@0,-3.25","First point is 3.25\" below that line"],
  ["T","FRO","Asks: <i>Base point</i>"],
  ["Do","Click the <b>RIGHT end</b> of the same General Notes line","Asks for the offset"],
  ["T","@0,-3.25","The line stretches across the box."],
  ["K","Enter","Done."]]},
 {t:"Copy it down twice (2.1\" apart)",r:[
  ["T","COPY","Asks: <i>Select objects</i>"],
  ["Do","Click the line you just drew","It highlights."],
  ["K","Enter","Asks for the base point"],
  ["T","0,0","Asks for the second point"],
  ["T","@0,-2.1","Copy 1"],
  ["T","@0,-4.2","Copy 2"],
  ["K","Enter","The box now has 3 dividers: notes, PE stamp, title."]]},
 {t:"Table lines (5 rows, 0.375\" each)",r:[
  ["T","COPY","Asks: <i>Select objects</i>"],
  ["Do","Click the <b>lowest</b> divider line","It highlights."],
  ["K","Enter","Asks for the base point"],
  ["T","0,0",""],["T","@0,-0.375",""],["T","@0,-0.75",""],["T","@0,-1.125",""],["T","@0,-1.5",""],["T","@0,-1.875",""],
  ["K","Enter","Five thin rows under the title area."]]},
 {t:"Table divider (1.3\" from the left)",r:[
  ["T","LINE","Asks for the first point"],
  ["T","FRO","Asks for the base point"],
  ["Do","Click the <b>LEFT end</b> of the table's top line (the lowest divider from before)","Asks for the offset"],
  ["T","@1.3,0","Start point"],
  ["T","@0,-1.875","Down through all 5 rows"],
  ["K","Enter","Done."]]},
 {t:"PE stamp circle",r:[
  ["T","CIRCLE","Asks for the center point"],
  ["T","FRO","Asks for the base point"],
  ["Do","Click the <b>LEFT end</b> of the General Notes line again","Asks for the offset"],
  ["T","@1.68,-4.3","Center of the stamp area"],
  ["T","0.75","Radius. The circle appears."]]},
 {t:"Lineweight back to 0.000\" (before any text)",r:[
  ["T","LWEIGHT","Settings window opens"],
  ["Do","Click <b>0.000\"</b> (near the top of the list), click <b>OK</b>","Text won't be thick."]]},
 {t:"Text style: Roman",r:[
  ["T","STYLE","The <b>Text Style</b> window opens."],

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function rowHTML([k,v,w]){
  let left;
  if(k==="T") left=`<div class="in"><span class="cmd">${esc(v)}</span><button class="copy" type="button" data-v="${esc(v)}" aria-label="Copy ${esc(v)}">Copy</button></div>`;
  else if(k==="K") left=`<div class="in"><kbd>${v}</kbd></div>`;
  else left=`<div class="act"><span class="tag">Do</span>${v}</div>`;
  return `<div class="row">${left}<div class="what">${w||""}</div></div>`;
}
function panelHTML(tab){
  let h="";
  if(tab.intro){const i=tab.intro;
    h+=`<div class="intro"><div><h2>${i.h}</h2><dl>${i.dl.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>${i.fix?`<div class="fix">${i.fix}</div>`:""}</div>
    <div class="pics">${i.pics.map(([k,c])=>`<figure><img src="${IMG[k]}" alt="${c}"><figcaption>${c}</figcaption></figure>`).join("")}</div></div>`;}
  if(tab.extra) h+=tab.extra;
  tab.steps.forEach((s,n)=>{const id=`${tab.id}-${n}`;const done=store.get("l7-"+id)==="1";
    h+=`<article class="step${done?" is-done":""}">
      <div class="step-head"><span class="num">Step ${n+1}</span><h3>${s.t}</h3>
      <label class="done" for="chk-${id}"><input type="checkbox" id="chk-${id}" data-id="${id}" ${done?"checked":""}> Done</label></div>
      ${s.g?`<p class="goal">${s.g}</p>`:""}
      <div class="rows"><div class="colhead"><span>You type / do</span><span>What AutoCAD asks or shows</span></div>${s.r.map(rowHTML).join("")}</div>
      ${s.check?`<div class="callout check"><span class="lbl">Check:</span>${s.check}</div>`:""}
      ${s.warn?`<div class="callout warn"><span class="lbl">If not:</span>${s.warn}</div>`:""}
    </article>`;});
  return h;
}
const tabsEl=document.getElementById("tabs"),panelsEl=document.getElementById("panels");
function count(tab){return tab.steps.filter((s,n)=>store.get(`l7-${tab.id}-${n}`)==="1").length}
function renderTabs(active){
  tabsEl.innerHTML=TABS.map(t=>`<button class="tab" role="tab" id="tab-${t.id}" aria-controls="panel-${t.id}" aria-selected="${t.id===active}">${t.label}<small>${count(t)}/${t.steps.length}</small></button>`).join("");
}
panelsEl.innerHTML=TABS.map(t=>`<section class="panel" role="tabpanel" id="panel-${t.id}" aria-labelledby="tab-${t.id}" hidden>${panelHTML(t)}</section>`).join("");
function show(id){
  if(!TABS.some(t=>t.id===id)) id="start";
  renderTabs(id);
  TABS.forEach(t=>{document.getElementById("panel-"+t.id).hidden=t.id!==id});
  store.set("lab7-tab",id);
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest("button.tab");if(!b)return;show(b.id.slice(4));window.scrollTo({top:0})});
panelsEl.addEventListener("change",e=>{const c=e.target.closest("input[data-id]");if(!c)return;
  store.set("l7-"+c.dataset.id,c.checked?"1":"0");c.closest(".step").classList.toggle("is-done",c.checked);
  const active=(tabsEl.querySelector('[aria-selected="true"]')||{}).id||"tab-start";renderTabs(active.slice(4));});
panelsEl.addEventListener("click",e=>{const b=e.target.closest("button.copy");if(!b)return;
  const v=b.dataset.v;const done=()=>{b.textContent="Copied";b.classList.add("ok");setTimeout(()=>{b.textContent="Copy";b.classList.remove("ok")},1200)};
  const fallback=()=>{const cmd=b.previousElementSibling;const r=document.createRange();r.selectNodeContents(cmd);const s=getSelection();s.removeAllRanges();s.addRange(r);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(done,fallback)}else fallback();});
const hash=(location.hash||"").slice(1);
show(TABS.some(t=>t.id===hash)?hash:(store.get("lab7-tab")||"start"));
</script>
